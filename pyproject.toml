# Development only: BlueNode installs this pack from git (requirements.txt, the package, the node files).
[project]
name = "bluenode-apple-home"
version = "0.1.0"
description = "Apple Home (HomeKit) nodes for BlueNode"
requires-python = ">=3.13"
dependencies = []

[dependency-groups]
dev = [
    "bluenode",
    "HAP-python>=5.2,<6",
    "pytest>=9",
    "pytest-asyncio>=1.5",
]

[tool.uv]
package = false

[tool.uv.sources]
bluenode = { path = "../BlueNode/backend", editable = true }

[tool.pytest.ini_options]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
testpaths = ["tests"]
pythonpath = ["."]
markers = ["network: needs PyPI (skipped with BLUENODE_OFFLINE=1)"]
